<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DW Job Center</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="job-center" class="hidden">
        <div class="container">
            <!-- Left sidebar - Job listings -->
            <div class="sidebar">
                <h1>Ravens工作中心</h1>
                
                <!-- Search and filter -->
                <div class="search-container">
                    <div class="search-input">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-jobs" placeholder="搜索工作...">
                    </div>
                    
                    <div class="filter-options">
                        <button class="filter-btn active" data-filter="所有">所有</button>
                        <button class="filter-btn" data-filter="兼职">兼职</button>
                        <button class="filter-btn" data-filter="申请制">申请制</button>
                    </div>
                </div>
                
                <!-- Job list -->
                <div class="job-list" id="job-list">
                    <!-- Jobs will be dynamically populated here -->
                </div>
            </div>
            
            <!-- Right side - Job details or welcome screen -->
            <div class="main-content">
                <div id="welcome-screen">
                    <div class="welcome-icon">💼</div>
                    <h2>欢迎应聘城市工作</h2>
                    <p>浏览Ravens相关招聘信息，找到您梦想中的工作。从列表中选择一个以查看详情~</p>
                </div>
                
                <div id="job-details" class="hidden">
                    <!-- Close button -->
                    <button id="close-details" class="close-btn">
                        <i class="fas fa-times"></i>
                    </button>
                    
                    <!-- Job details content -->
                    <div class="details-content">
                        <div class="job-header">
                            <div id="job-icon" class="job-icon"></div>
                            <h2 id="job-title"></h2>
                            <p id="job-department"></p>
                        </div>
                        
                        <!-- Job highlights -->
                        <div class="job-highlights">
                            <div class="highlight">
                                <i class="fas fa-dollar-sign"></i>
                                <div>
                                    <p class="highlight-label">薪酬</p>
                                    <p id="job-salary" class="highlight-value"></p>
                                </div>
                            </div>
                            <div class="highlight">
                                <i class="fas fa-map-marker-alt"></i>
                                <div>
                                    <p class="highlight-label">位置</p>
                                    <p id="job-location" class="highlight-value"></p>
                                </div>
                            </div>
                            <div class="highlight">
                                <i class="fas fa-clock"></i>
                                <div>
                                    <p class="highlight-label">时间要求</p>
                                    <p id="job-schedule" class="highlight-value"></p>
                                </div>
                            </div>
                            <div class="highlight">
                                <i class="fas fa-award"></i>
                                <div>
                                    <p class="highlight-label">类型</p>
                                    <p id="job-type" class="highlight-value"></p>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Description -->
                        <div class="job-section">
                            <h3>描述</h3>
                            <p id="job-description"></p>
                        </div>
                        
                        <!-- Requirements -->
                        <div class="job-section">
                            <h3>要求</h3>
                            <ul id="job-requirements">
                                <!-- Requirements will be populated here -->
                            </ul>
                        </div>
                        
                        <!-- Benefits -->
                        <div class="job-section">
                            <h3>福利</h3>
                            <ul id="job-benefits">
                                <!-- Benefits will be populated here -->
                            </ul>
                        </div>
                        
                        <!-- Apply button or application form -->
                        <div id="job-actions" class="job-actions">
                            <button id="apply-job-btn" class="action-btn">
                                <i class="fas fa-user-check"></i>
                                <span>申请此工作</span>
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Application Form -->
                <div id="application-form" class="hidden">
                    <button id="back-to-details" class="back-btn">
                        <i class="fas fa-arrow-left"></i> 返回到工作描述页
                    </button>
                    
                    <div class="form-header">
                        <h2>申请 <span id="application-job-title"></span></h2>
                        <p>请仔细且详细地回答所有问题，您的申请将被发给相关部门负责人查看！</p>
                    </div>
                    
                    <div class="form-content">
                        <div id="form-questions">
                            <!-- Questions will be dynamically populated here -->
                        </div>
                        
                        <div class="form-actions">
                            <button id="submit-application" class="action-btn">
                                <i class="fas fa-paper-plane"></i>
                                <span>提交申请</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="review.js"></script>
</body>
</html>
