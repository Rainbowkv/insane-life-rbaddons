<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>赞助</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
      gap: 10px;
    }

    .tab {
      background-color: #2a2a2a;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }

    .tab:hover {
      background-color: #444;
    }

    .tab.active {
      background-color: #ffd700;
      color: #000;
      font-weight: bold;
    }

    .container {
      width: 60vw;
      max-height: 29vh;
      background: #1e1e1e;
      border-radius: 16px;
      overflow-y: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .vehicle {
      position: relative;
      background-color: #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease;
    }

    .vehicle:hover {
      transform: scale(1.03);
    }

    .vehicle img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }

    .vehicle-name {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
    }

    .vehicle-price {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="tabs">
      <button class="tab active" data-type="vehicles">载具</button><!-- 🚗  -->
      <!-- <button class="tab" data-type="items">物品</button> 🎒  -->
      <!-- <button class="tab" data-type="others">其他</button> 💎  -->
    </div>

    <div class="container" id="product-list">
      <!-- 商品元素将在 JS 中动态插入 -->
    </div>
  </div>

  <script>
    let allProducts = {
      vehicles: [],
      items: [],  
      others: []
    };
    const container = document.getElementById("product-list");

    // 默认隐藏 UI
    document.querySelector(".wrapper").style.display = "none";
    document.body.style.background = "transparent";

    // 切换分类函数
    function renderCategory(type) {
      container.innerHTML = "";

      allProducts[type].forEach(product => {
        const item = document.createElement("div");
        item.className = "vehicle";
        item.innerHTML = `
          <img src="${product.image}" alt="图片">
          <div class="vehicle-name">${product.name}</div>
          <div class="vehicle-price">${product.price} 赞助点</div>
        `;
        container.appendChild(item);
      });
    }

    // 监听 tab 点击事件
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        const type = tab.dataset.type;
        renderCategory(type);
      });
    });

    // 监听后端消息
    window.addEventListener("message", function (event) {
      if (event.data.type === "updateProducts") {
        allProducts = event.data.products;
        renderCategory("vehicles"); // 默认显示载具
      }

      if (event.data.type === "toggleUI") {
        const wrapper = document.querySelector(".wrapper");
        if (event.data.show) {
          wrapper.style.display = "flex";
          document.body.style.background = "rgba(0,0,0,0.5)";
          fetch(`https://${GetParentResourceName()}/focus`, {
            method: "POST",
            body: JSON.stringify({ focus: true })
          });
        } else {
          wrapper.style.display = "none";
          document.body.style.background = "transparent";
          fetch(`https://${GetParentResourceName()}/focus`, {
            method: "POST",
            body: JSON.stringify({ focus: false })
          });
        }
      }
    });

    // 按 ESC 关闭
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        document.querySelector(".wrapper").style.display = "none";
        document.body.style.background = "transparent";

        fetch(`https://${GetParentResourceName()}/focus`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ focus: false })
        });

        fetch(`https://${GetParentResourceName()}/closedByUser`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({})
        });
      }
    });
  </script>
</body>
</html>
