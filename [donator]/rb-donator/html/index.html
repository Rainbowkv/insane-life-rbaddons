<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>赞助</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
      gap: 10px;
    }

    .tab {
      background-color: #2a2a2a;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }

    .tab:hover {
      background-color: #444;
    }

    .tab.active {
      background-color: #ffd700;
      color: #000;
      font-weight: bold;
    }

    .container {
      width: 60vw;
      max-height: 29vh;
      background: #1e1e1e;
      border-radius: 16px;
      overflow-y: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }
    
    .vehicles {
      position: relative;
      background-color: #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease;
    }

    .vehicles:hover {
      transform: scale(1.03);
    }

    .vehicles img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }

    .vehicle-name {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
    }

    .vehicle-price {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
    }

    .items {
      position: relative;
      background-color: #2a2a2a;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease;
    }

    .items:hover {
      transform: scale(1.03);
    }

    .items img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .item-name {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
    }

    .item-price {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="coins" style="color: #00BFFF; margin-bottom: 10px; font-size: 16px;">
      ⚡ 赞助点：加载中...
    </div>
    <div class="tabs">
      <button class="tab active" data-type="vehicles">载具</button><!-- 🚗  -->
      <button class="tab" data-type="items">物品</button>  <!-- 🎒  -->
      <!-- <button class="tab" data-type="others">其他</button> 💎  -->
    </div>

    <div class="container" id="product-list">
      <!-- 商品元素将在 JS 中动态插入 -->
    </div>

    <div id="confirm-modal" style="display: none; position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh; background: rgba(0,0,0,0.7);
      align-items: center; justify-content: center; z-index: 999;">
      <div style="background: #2a2a2a; padding: 20px 30px; border-radius: 12px; text-align: center; color: white; width: 300px;">
        <p id="confirm-text">确认购买？</p>
        <div style="margin-top: 20px;">
          <button id="confirm-yes" style="padding: 8px 16px; margin-right: 10px;">✅ 确定</button>
          <button id="confirm-no" style="padding: 8px 16px;">❌ 取消</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let allProducts = {
      vehicles: [],
      items: [],  
      others: []
    };
    const container = document.getElementById("product-list");

    // 默认隐藏 UI
    document.querySelector(".wrapper").style.display = "none";
    document.body.style.background = "transparent";

    // 切换分类函数
    function renderCategory(type) {
      container.innerHTML = "";

      allProducts[type].forEach(product => {
        const item = document.createElement("div");
        item.className = type;
        item.innerHTML = renderProductHTML(type, product);

        // ✅ 点击商品 → 弹出确认框
        item.addEventListener("click", () => {
          showConfirmModal(product, item.className);
        });

        container.appendChild(item);
      });
    }
    function renderProductHTML(type, product) {
      if (type === "vehicles") {
        return `
          <img src="${product.image}" alt="图片">
          <div class="vehicle-name">${product.name}</div>
          <div class="vehicle-price">${product.price} 赞助点</div>
        `;
      } else if (type === "items") {
        return `
          <img src="${product.image}" alt="物品图片">
          <div class="item-name">${product.name}</div>
          <div class="item-price">${product.price} 赞助点</div>
        `;
      }
      return "";
    }

    // 监听 tab 点击事件
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        const type = tab.dataset.type;
        renderCategory(type);
      });
    });

    // 监听点击物品事件
    function showConfirmModal(product, className) {
      const modal = document.getElementById("confirm-modal");
      const confirmText = document.getElementById("confirm-text");
      const yesBtn = document.getElementById("confirm-yes");
      const noBtn = document.getElementById("confirm-no");

      confirmText.textContent = `是否花 ${product.price} 个赞助点购买 ${product.name}？`;
      modal.style.display = "flex";

      // 移除旧监听器（防止多次绑定）
      const newYesBtn = yesBtn.cloneNode(true);
      yesBtn.parentNode.replaceChild(newYesBtn, yesBtn);

      newYesBtn.addEventListener("click", () => {
        fetch(`https://${GetParentResourceName()}/rb-donator:purchaseProduct`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: product.name, className: className })
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            // 成功则关闭整个界面
            document.querySelector(".wrapper").style.display = "none";
            document.body.style.background = "transparent";
            modal.style.display = "none";

            fetch(`https://${GetParentResourceName()}/rb-donator:focus`, {
              method: "POST",
              body: JSON.stringify({ focus: false })
            });
          } else {
            modal.style.display = "none";
          }
        });
      });

      noBtn.onclick = () => {
        modal.style.display = "none";
      };
    }

    // 监听后端消息
    window.addEventListener("message", function (event) {
      // 商品数据消息
      if (event.data.type === "updateProducts") {
          allProducts = event.data.products;
          renderCategory("vehicles"); // 默认显示载具
      }
      // 赞助点消息
      if (event.data.type === "balanceUpdate") {
        document.getElementById("coins").textContent = `⚡ 赞助点：${event.data.amount}`;
      }
      // 切换UI消息
      if (event.data.type === "toggleUI") {
        const wrapper = document.querySelector(".wrapper");
        if (event.data.show) {
          document.querySelectorAll(".tab").forEach(tab => {  // ✅ 切换载具 tab 高亮
            tab.classList.remove("active");
            if (tab.dataset.type === "vehicles") {
              tab.classList.add("active");
            }
          });
          wrapper.style.display = "flex";
          document.body.style.background = "rgba(0,0,0,0.5)";
          fetch(`https://${GetParentResourceName()}/rb-donator:focus`, {
            method: "POST",
            body: JSON.stringify({ focus: true })
          });
        } else {
          wrapper.style.display = "none";
          document.body.style.background = "transparent";
          fetch(`https://${GetParentResourceName()}/rb-donator:focus`, {
            method: "POST",
            body: JSON.stringify({ focus: false })
          });
        }
      }
    });

    // 按 ESC 关闭
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        document.querySelector(".wrapper").style.display = "none";
        document.body.style.background = "transparent";

        fetch(`https://${GetParentResourceName()}/rb-donator:focus`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ focus: false })
        });

      }
    });
  </script>
</body>
</html>
