<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Ravens流动编号追踪</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="overlay"></div>
    <div id="tracker-panel">
        <h1>Ravens流动编号追踪</h1>
        <div class="filter-container">
            <input id="srcFilter" placeholder="输入流动编号过滤">
            <button onclick="applyFilter()">筛选</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>公民ID</th>
                    <th>姓名</th>
                    <th>流动编号</th>
                    <th>登录时间</th>
                    <th>离线时间</th>
                </tr>
            </thead>
            <tbody id="sessionData"></tbody>
        </table>

        <div class="pagination">
            <button onclick="prevPage()">上一页</button>
            <span id="pageIndicator">第 1 页</span>
            <button onclick="nextPage()">下一页</button>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
